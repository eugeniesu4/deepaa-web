name: Sync original DeepAA Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original DeepAA Web
        run: git clone --depth 1 https://github.com/n317/DeepAAonWeb.git /tmp/deepaa

      - name: Copy original docs
        run: |
          cp -a /tmp/deepaa/docs/. .
          sed -i 's/DeepAA on Web : Version 2.2/DeepAA on Web : Version 2.3/g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy original DeepAA Web as v2.3' || true
          git push
